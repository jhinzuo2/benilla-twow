[package]
name = "benilla-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Bevy app as a library: everything but the build-id stamp, which lives in the `benilla` launcher so a new commit does not rebuild this crate"

[lints]
workspace = true

[features]
# `dev` compiles in the instruments; the player build (`scripts/gates.sh`) has no defaults.
default = ["dev"]
# The asset, format and world crates default `dev` on, so they come in without it, forwarded here.
dev = ["benilla-assets/dev", "benilla-formats/dev", "benilla-world/dev", "dep:bevy_egui"]
tracy = ["bevy/trace_tracy"]
# Writes every system's per-run span to `trace-<ts>.json` in the cwd.
trace_chrome = ["bevy/trace_chrome"]

[dependencies]
anyhow.workspace = true
benilla-ui = { path = "../benilla-ui" }
bevy.workspace = true
wgpu.workspace = true
bevy_egui = { version = "0.39", optional = true }
bytemuck = { version = "1", features = ["derive"] }
# `f16` decode for the `WOW_BOOTH_DUMP` dump of the `Rgba16Float` booth targets.
half = "2"
# Compiles `assets/ui` into the binary, so the interface loads on a machine without the source.
include_dir = "0.7"
# The 1.12 chat filters (`text_filter`), with one `RegexSet` for the any-match pass per line.
regex = "1"
# `getrusage` for perf CPU time; the audio clock and render thread's realtime policy on macOS.
libc = "0.2"
# PNG encoding only: the macOS cursor's NSImage data and screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
# Thread-to-ECS channels: crossbeam's `Receiver` is `Sync`, so it is a resource without a mutex.
crossbeam-channel = "0.5"
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-protocol = { path = "../benilla-protocol" }
benilla-world = { path = "../benilla-world", default-features = false }
# The CVar diff persisted in `benilla-config/config.toml`.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Collision for our kinematic character controller; 0.6 targets Bevy 0.18, 0.7 moves to 0.19.
avian3d = "0.6"
# Shapes and rasterizes `FontString` text standalone (`ui_text`), at bevy_text's own 0.16.
cosmic-text = "0.16"
# `cosmic-text`'s font database, named by `ui_text`; must stay the version it depends on.
fontdb = "0.23"
# The mixer. Its `cpal` backend stays off on every target: `sound::output` is our own backend.
kira = { version = "0.12", default-features = false, features = ["mp3", "wav", "pcm", "adpcm"] }
# Aborts a debug build on an allocation in the audio IO callback or render pass; off in release.
assert_no_alloc = "1.1"
# `MediaSource`: our source raises kira's decode thread's QoS; must stay kira's version.
symphonia = { version = "0.5", default-features = false }
# The audio threads' lock-free SPSC rings (output, mix tap); kira's version, so the graph has one.
rtrb = "0.3"
mint = "0.5"
# The gossip greeting's weighted draw, re-rolled per open as in the reference.
rand = "0.8"

# Wayland clipboard over the standard `wl_data_device`; arboard's speaks `wlr-data-control`,
# which GNOME does not implement.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
raw-window-handle = "0.6"
smithay-clipboard = "0.7"

# A native NSCursor: winit's cursor rects revert to the arrow under a continuous render loop.
[target.'cfg(target_os = "macos")'.dependencies]
# The audio device layer (`sound::output::coreaudio`), at the versions and features cpal uses.
coreaudio-rs = { version = "0.13", default-features = false, features = ["audio_unit", "core_audio"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSView",
    "NSImage",
    "NSCursor",
    "NSEvent",
] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSGeometry"] }

# The audio device layer off macOS (`sound::output::cpal`); on macOS cpal cannot rebuild on a
# lost default device and drops the IO-cycle timestamp.
[target.'cfg(not(target_os = "macos"))'.dependencies]
cpal = "0.17"

# Windows CPU clocks for `perf::clock`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # `local_state::windows_documents_dir` — SHGetKnownFolderPath (Win32_UI_Shell) and the
    # CoTaskMemFree that frees the string it allocates (Win32_System_Com). Added for the
    # Documents-folder config fix; see that function's doc comment for why it exists.
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

# Android: turns on bevy_winit's NativeActivity backend, which is what makes
# `bevy::winit::AndroidApp`/`ANDROID_APP` exist at all (crates/benilla-android reads both — see
# its src/lib.rs). Cargo unifies feature sets across every place a workspace names the same
# dependency at the same version, so this ADDS the feature on top of whatever
# `[workspace.dependencies] bevy = ...` already specifies rather than replacing it — no version
# given here on purpose, so it can never drift from the workspace pin.
#
# `android-native-activity`, not `android-game-activity`: NativeActivity is the older, simpler
# activity class and the one `benilla-android`'s scaffold targets. GameActivity needs a Java/
# Kotlin `GameActivity` subclass and AndroidX Game SDK on the Gradle side — a real option later
# for proper controller/IME support, but more moving parts than a first "does it open a window"
# spike needs.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-native-activity"] }

# arboard has no Android backend at all (verified against its own src/platform/mod.rs: the linux
# module is `cfg(not(target_os = "android"))`, and there is no android module anywhere in the
# crate), so an unconditional `arboard = "3"` in [dependencies] fails to compile on
# aarch64-linux-android with "cannot find `Clipboard` in `platform`" etc. — not a runtime gap, a
# missing type. Moved here so a phone build never asks for it; clipboard.rs's arboard impl block
# and its one call site are `#[cfg(not(target_os = "android"))]` to match, with a no-op
# `NoClipboard` backend standing in for Android until a JNI ClipboardManager shim exists.
[target.'cfg(not(target_os = "android"))'.dependencies]
# OS clipboard access for the UI EditBox copy/cut/paste chords (chat input). Already in the tree via
# bevy_egui; pinned to the same 3.x so there's one copy. Read on the main thread (the UI key feed is
# a NonSend system) — required for the macOS NSPasteboard path. Covers macOS, Windows, and Linux/BSD
# under X11; the Wayland backend is `smithay-clipboard` above (decision 0702).
arboard = "3"

# The login cycle's fake realmd runs the server half of SRP6 (`net::io::cycle_tests`).
[dev-dependencies]
benilla-srp = { path = "../benilla-srp" }
num-bigint = "0.4.6"
sha1.workspace = true
