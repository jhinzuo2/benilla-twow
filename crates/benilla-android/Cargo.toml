[package]
name = "benilla-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = """Android entry point: a #[bevy_main] fn main(), matching bevy's own maintained \
    mobile example (bevyengine/bevy examples/mobile). The macro generates the real \
    android_main/AndroidApp/ANDROID_APP plumbing itself (verified against bevy_derive 0.18.1's \
    own macro source) -- this crate only sets WOW_DATA/BENILLA_HOME before calling the same \
    benilla_app::run() the desktop shim calls. An earlier version of this file hand-wrote \
    android_main and guessed at bevy::winit::AndroidApp/ANDROID_APP; both were wrong and failed \
    to compile -- see src/lib.rs's header for what actually happened and where the real paths \
    (bevy::android, not bevy::winit) came from."""

# Android needs a cdylib the JVM/NativeActivity loads (libbenilla_android.so), not a bin target --
# confirmed against bevy's own mobile example (crate-type = ["staticlib", "cdylib"] there, for an
# iOS+Android-shared crate; cdylib alone is right here since this crate is Android-only) and
# against a real practitioner's write-up (nikl.me, "Notes on Android development using Bevy")
# describing the identical two-crate split this workspace already has: a desktop bin
# (crates/benilla) plus a separate `#[bevy_main]`-only cdylib (this crate) for Android, because
# cargo-apk specifically requires a cdylib. Keep the desktop `benilla` crate's bin untouched --
# this is a parallel entry point, not a replacement, so `cargo build -p benilla` on desktop stays
# unaffected.
[lib]
name = "benilla_android"
crate-type = ["cdylib"]

[dependencies]
# default-features = false for the same reason crates/benilla/Cargo.toml gives: without it, this
# crate's own defaults would compile the full dev tree regardless of what --no-default-features
# says at the top level. The player-build gate must be explicit at every entry point, not just
# the desktop one.
benilla-app = { path = "../benilla-app", default-features = false }
benilla-buildstamp = { path = "../benilla-buildstamp" }

# Needed directly (not just transitively through benilla-app) for `bevy::prelude::bevy_main` --
# the attribute macro this crate's src/lib.rs uses on its `fn main()`. `default-features = false`
# here too, matching benilla-app's own pin, so this doesn't pull in a second differently-featured
# copy of bevy for the dependency resolver to reconcile. The workspace's shared
# `[workspace.dependencies] bevy = ...` entry supplies the version and feature list; this just
# opts in.
bevy.workspace = true

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

# Read by `cargo apk build` (see .github/workflows/ci.yml's `android` job) to generate
# AndroidManifest.xml and package the APK -- there is no hand-written manifest anywhere in this
# crate; this section IS the manifest's source of truth for a cargo-apk build.
#
# Shaped directly against bevy's own maintained `examples/mobile/Cargo.toml` (fetched from
# bevyengine/bevy and confirmed field-for-field on 2026-09-16), not assembled from memory or
# blended cargo-apk-version docs -- an earlier draft of this section did that and got several
# field names wrong (uses_feature vs feature, application.activity.orientation that doesn't exist
# in bevy's own example, a fullscreen theme bevy's example doesn't set either). Every field below
# has a direct counterpart in that source; nothing here is invented. bevy's example omits
# min_sdk_version, orientation, and any theme/fullscreen setting entirely -- so this does too,
# rather than guessing values are needed that the project bevy itself ships doesn't carry.
[package.metadata.android]
package = "com.benilla.twow"
apk_name = "benilla"
# aarch64 only for the first pass (see the CI workflow's own comment on why armv7 is deferred).
# bevy's example builds both; trimmed to one here on purpose, not an oversight -- add
# "armv7-linux-androideabi" back once aarch64 alone is confirmed working end to end.
build_targets = ["aarch64-linux-android"]
# Strips debug symbols from the shared library, shrinking the APK -- bevy's example does this by
# default; remove if a debug build needs symbols for on-device gdb.
strip = "strip"
# UNSET on purpose, unlike bevy's example (which points these at its own `assets/` folder): all of
# benilla's assets are compiled into the binary via `include_dir` (crates/benilla-app/Cargo.toml's
# own comment on the shipped FrameXML tree) or fetched from the player's own WOWDATA/
# benilla-config at runtime (this crate's src/lib.rs) -- there is no separate assets folder for
# cargo-apk to bundle. Leave `assets`/`resources` absent unless that changes.

[package.metadata.android.sdk]
# Matches bevy's own example's target_sdk_version exactly (31) as the known-working starting
# point, rather than picking a newer number unverified. Raise deliberately once a first build is
# confirmed working, not preemptively.
target_sdk_version = 31
# Left unset until the aarch64-linux-android23 link failure below: cargo-apk defaults an unset
# min_sdk_version to 23, and cpal's Android backend links `-laaudio` UNCONDITIONALLY -- it has no
# Oboe/OpenSL ES fallback path, so the crate simply requires AAudio to exist at link time. AAudio
# was added to the NDK sysroot at API level 26 (Android 8.0); at 23 there is no `libaaudio.so`
# stub anywhere in the sysroot for the linker to find:
#   ld.lld: error: unable to find library -laaudio
# not a missing search path or a misspelled flag -- the library genuinely does not exist for that
# platform level. 26 is the floor cpal's chosen backend imposes, not a preference picked here;
# raising it further later is a product decision, but going below 26 will reintroduce this exact
# failure regardless of anything else in this file.
min_sdk_version = 26

# See https://developer.android.com/guide/topics/manifest/uses-permission-element
#
# Note: there can be multiple .uses_permission entries -- cargo-apk (confirmed against the 0.10
# line this project pins in CI, `cargo install cargo-apk --locked`) only emits a `<uses-permission>`
# into the generated manifest for what's listed here; nothing else in this file implies INTERNET,
# and no dependency's own manifest fragment merges one in either (cargo-apk 0.10 has no manifest
# merging step at all -- this file is the WHOLE source of truth for what ends up in the APK). That
# is why, prior to this entry, the installed app had no network access whatsoever: realmlist/login
# connect over a plain TCP socket (`benilla-app`'s `net/io.rs`), and Android denies socket() with
# EACCES for any app lacking this permission, regardless of the code being otherwise correct and
# already proven working on desktop.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Not strictly required to open a socket, but `benilla-app`'s net layer (and most Rust networking
# crates transitively) commonly check reachability/connectivity type via this before attempting a
# connection; harmless to include even if nothing currently reads it, and saves a second
# confused-silence bug report later if that ever changes.
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "Benilla"
# No `icon` line: bevy's example points this at its own `@mipmap/ic_launcher`, which lives in a
# `resources` folder this crate doesn't have (see the note above). Add an icon + the matching
# `resources = "..."` path together once real app assets exist -- cargo-apk's default (no icon
# entry) is fine for a first "does it build and open a window" pass.

