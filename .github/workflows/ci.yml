name: CI ( Build without Test blockage)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: benilla
            asset_name: benilla-linux-x86_64
          - os: windows-latest
            artifact_name: benilla.exe
            asset_name: benilla-windows-x86_64.exe
          - os: macos-latest
            artifact_name: benilla
            asset_name: benilla-macos-x86_64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # bevy_audio pulls alsa on Linux and gilrs (gamepad support) pulls udev -- both link against
      # system libs rather than vendoring them, so the dev headers have to exist before `cargo
      # build` touches those crates. x11/xkbcommon/wayland are all dlopen'd at runtime by winit
      # (x11-dl / xkbcommon-dl / smithay-client-toolkit), so no dev headers are needed for those.
      # Windows and macOS need nothing extra: cpal/gilrs link against SDK and framework libs the
      # runner images already ship with.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      # Reads channel/components straight from the repo's rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Only the player-facing binary (`-p benilla`), not `--workspace --all-targets`. Building
      # every crate's test binaries too would relink a full Bevy executable per test target --
      # multi-GB of debug output that has actually blown through the windows-latest runner's free
      # disk before now. This also happens to be the only artifact worth downloading and running.
      - name: cargo build --release -p benilla
        run: cargo build --release --locked -p benilla

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  # Separate job, not a fourth matrix row: the desktop three share one toolchain shape (rustup +
  # apt/nothing + `cargo build`), Android needs the NDK, a second Rust target, and `cargo-apk`
  # instead of a plain `cargo build` -- different enough that folding it into the matrix would mean
  # `if: runner.os == ...` branches on nearly every step rather than the one Linux-only step above.
  #
  # UNTESTED as of this workflow's first commit: this job has never actually produced or run an
  # APK. If it goes red, that is real, new information about the Android port -- not a sign the
  # YAML itself is wrong. Read the actual cargo/cargo-apk error before assuming either.
  android:
    name: build (android)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Same rationale as the desktop Linux job's apt step -- alsa/udev headers for the same two
      # crates (bevy_audio's alsa backend, gilrs' udev backend), which link against system libs on
      # every Linux-hosted build regardless of the final target triple. Android's OWN audio/input
      # stacks are separate (cpal's Oboe/AAudio backend, no gilrs on Android), but the BUILD
      # machine is still Ubuntu here, so its own linker still wants these for the host-side parts
      # of the build graph (build scripts, proc macros) the same way the desktop Linux job does.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # aarch64 covers effectively every real Android device from the last several years.
          # armv7 (32-bit) is left out for now -- add it back here AND to the `cargo apk build`
          # step's implicit target list (cargo-apk builds every target you've added unless told
          # otherwise) once aarch64-only is confirmed working; building two ABIs before the first
          # one has even been proven out just doubles the surface for an unrelated failure to hide
          # in.
          targets: aarch64-linux-android

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Own cache key: this job's target dir holds aarch64-linux-android artifacts, which
          # share nothing with the desktop jobs' host-triple ones. Sharing a key would mean one
          # cache entry ping-pongs between two incompatible artifact sets on every run, evicting
          # useful cached objects from both sides instead of caching either.
          key: android
          cache-on-failure: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK (cmdline-tools, platform-tools, build-tools, one platform) and NDK, side by
      # side. android-actions/setup-android installs the SDK; the NDK is pulled separately because
      # cargo-apk needs a specific NDK version on ANDROID_NDK_HOME/ANDROID_NDK_ROOT, not whatever
      # the SDK step's default component set happens to include.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          # r26 is the last NDK line with broad, well-tested cargo-ndk/cargo-apk compatibility as
          # of this workflow's writing. Bump deliberately, not opportunistically -- an NDK bump is
          # exactly the kind of change that wants its own isolated CI run to read, given this job
          # is unverified end-to-end already.
          ndk-version: r26d
          add-to-path: true

      # cargo-apk drives `AndroidManifest.xml` generation (from `[package.metadata.android]` in
      # benilla-android's Cargo.toml -- see the scaffold README for what still needs adding there),
      # APK packaging, and debug signing in one command, so no separate Gradle project is needed for
      # this first pass. `cargo-ndk` (used by some setups instead) skips the manifest/packaging
      # step and expects you to drive Gradle yourself -- more control, more moving parts; not
      # needed yet for "does it open a window".
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      # `--release` mirrors the desktop jobs. `-p benilla-android` targets the cdylib crate the
      # scaffold added, not the desktop `benilla` bin -- the two are separate crates on purpose
      # (see benilla-android/Cargo.toml) so this line can never accidentally build the wrong one.
      - name: cargo apk build --release -p benilla-android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo apk build --release -p benilla-android

      # cargo-apk's own release output path -- fixed by the tool, not something this workflow
      # chose. The filename stem comes from `apk_name = "benilla"` in benilla-android/Cargo.toml's
      # [package.metadata.android] (verified against bevy's own mobile example's equivalent
      # field), so expect something like target/release/apk/benilla.apk once this actually runs --
      # the glob below doesn't depend on getting that exact name right, but confirm the real path
      # once the job has run once regardless; this whole job is unverified end to end.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: benilla-android-aarch64.apk
          path: target/release/apk/*.apk
          if-no-files-found: error
